<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0fdf4;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(#22c55e 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: -12px -12px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 900;
            color: #15803d;
            margin-bottom: 12px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.05);
        }

        .header p {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1000px;
        }

        .lobby-card {
            background: white;
            border-radius: 24px;
            padding: 32px 24px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 3px solid transparent;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        /* Staggered animation delays */
        .lobby-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .lobby-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .lobby-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .lobby-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .card-icon {
            font-size: 4.5rem;
            margin-bottom: 20px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .lobby-card:hover .card-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 700;
            line-height: 1.5;
        }

        /* Specific card styles */
        .card-4b {
            border-bottom-color: #3b82f6;
        }

        .card-4b:hover {
            border-color: #3b82f6;
        }

        .card-4b .card-title {
            color: #2563eb;
        }

        .card-kitchen {
            border-bottom-color: #f59e0b;
        }

        .card-kitchen:hover {
            border-color: #f59e0b;
        }

        .card-kitchen .card-title {
            color: #d97706;
        }

        .card-expr {
            border-bottom-color: #8b5cf6;
        }

        .card-expr:hover {
            border-color: #8b5cf6;
        }

        .card-expr .card-title {
            color: #7c3aed;
        }

        .footer {
            margin-top: 60px;
            font-size: 0.95rem;
            color: #94a3b8;
            font-weight: 700;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2.2rem;
            }

            .lobby-card {
                padding: 24px 20px;
            }

            .card-icon {
                font-size: 3.5rem;
            }

            .card-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🌟 Word Explorer Lobby 🌟</h1>
        <p>Choose your vocabulary learning adventure today!</p>
    </div>

    <div class="cards-grid">
        <!-- 4B Textbooks -->
        <a href="vocab_sets/4b/index.html" class="lobby-card card-4b">
            <div class="card-icon">🎒</div>
            <h2 class="card-title">四年级课文单词</h2>
            <p class="card-desc">原版 4B 课文同步词汇，强化基础读写与记忆。</p>
        </a>

        <!-- Kitchen Kids -->
        <a href="vocab_sets/kitchen_kids/index.html" class="lobby-card card-kitchen">
            <div class="card-icon">👨‍🍳</div>
            <h2 class="card-title">Kitchen Kids 拓展</h2>
            <p class="card-desc">课外英语阅读拓展，专攻高频与核心进阶生词。</p>
        </a>

        <!-- Expressions 100 -->
        <a href="vocab_sets/expressions/index.html" class="lobby-card card-expr">
            <div class="card-icon">💬</div>
            <h2 class="card-title">100 Sentences</h2>
            <p class="card-desc">地道英文表达 100 句，中英互译默写实战演练。</p>
        </a>
    </div>

    <div class="footer">
        Have fun learning! ✨
    </div>

</body>

</html>
